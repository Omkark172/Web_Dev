<!DOCTYPE html>
<html>

<head>
    <title>Web Page Design</title>
</head>

<body>
    <h2>My Web Page</h2>
    <!-- Hyperlink -->
    <a href="https://www.google.com" target="_blank">Visit Google</a>
    <br><br>
    <!-- Image -->
    <img src="image.jpg" alt="Sample Image" width="200" height="150">
    <br><br>
    <!-- Table with Nested Table -->
    <table border="1" cellpadding="5">
        <tr>
            <th>Name</th>
            <th>Details</th>
        </tr>
        <tr>
            <td>Student</td>
            <td>
                <table border="1" cellpadding="5">
                    <tr>
                        <th>Age</th>
                        <th>Branch</th>
                    </tr>
                    <tr>
                        <td>20</td>
                        <td>Computer</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
