<!DOCTYPE html>
<html>

<head>
    <title>CSS Styling Example</title>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Internal CSS -->
    <style>
        h2 {
            color: green;
            text-align: center;
        }

        table {
            width: 50%;
            border-collapse: collapse;
        }
    </style>
</head>

<body>
    <!-- Inline CSS -->
    <h1 style="color: blue; text-align: center;">CSS Styling Demonstration</h1>
    <h2>Student Information</h2>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Course</th>
        </tr>
        <tr>
            <td>Rahul</td>
            <td>Web Development</td>
        </tr>
        <tr>
            <td>Anita</td>
            <td>Computer Science</td>
        </tr>
    </table>
</body>

</html>
